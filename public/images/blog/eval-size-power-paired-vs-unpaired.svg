<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How often an eval can tell 83% from 80%, by eval size</title>
  <desc id="d">Line chart from 5,000 simulated evals per point. The share of evals whose 95% confidence interval excludes zero, for a true 83% against 80%. With separate samples it rises from 4% at 25 examples to 40% at 1,000. With the same examples and a paired analysis it rises from 5% to 68%. At 100 examples it is 7% unpaired and 11% paired. Neither reaches the 80% line.</desc>
  <rect width="760" height="460" fill="#30302E"/>
  <text x="40" y="44" fill="#FAF9F5" font-size="20" font-weight="600">Can the eval tell 83% from 80%?</text>
  <text x="40" y="68" fill="#FAF9F5" fill-opacity="0.7" font-size="13">Share of simulated evals whose 95% interval excludes zero. 5,000 evals per point.</text>

  <g stroke="#FAF9F5" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="80" y1="293.3" x2="720" y2="293.3"/>
    <line x1="80" y1="226.7" x2="720" y2="226.7"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
  </g>
  <line x1="80" y1="93.3" x2="720" y2="93.3" stroke="#FAF9F5" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="716" y="85" fill="#FAF9F5" fill-opacity="0.8" font-size="12" text-anchor="end">80% power, the usual target</text>

  <g fill="#FAF9F5" fill-opacity="0.7" font-size="12" text-anchor="end">
    <text x="70" y="364">0%</text>
    <text x="70" y="297">20%</text>
    <text x="70" y="231">40%</text>
    <text x="70" y="164">60%</text>
    <text x="70" y="97">80%</text>
  </g>
  <g fill="#FAF9F5" fill-opacity="0.7" font-size="12" text-anchor="middle">
    <text x="100" y="384">25</text>
    <text x="224" y="384">50</text>
    <text x="348" y="384">100</text>
    <text x="472" y="384">200</text>
    <text x="596" y="384">500</text>
    <text x="720" y="384">1,000</text>
  </g>
  <text x="400" y="410" fill="#FAF9F5" fill-opacity="0.7" font-size="13" text-anchor="middle">Examples in the eval set</text>

  <!-- separate samples: 4.2 5.2 6.9 11.9 21.3 40.4 -->
  <polyline fill="none" stroke="#FAF9F5" stroke-opacity="0.85" stroke-width="2.5" points="100,346 224,342.7 348,337 472,320.3 596,289 720,225.3"/>
  <g fill="#FAF9F5"><circle cx="100" cy="346" r="4"/><circle cx="224" cy="342.7" r="4"/><circle cx="348" cy="337" r="4"/><circle cx="472" cy="320.3" r="4"/><circle cx="596" cy="289" r="4"/><circle cx="720" cy="225.3" r="4"/></g>

  <!-- paired: 5.0 7.2 11.1 17.4 38.8 67.8 -->
  <polyline fill="none" stroke="#D97757" stroke-width="3" points="100,343.3 224,336 348,323 472,302 596,230.7 720,134"/>
  <g fill="#D97757"><circle cx="100" cy="343.3" r="4.5"/><circle cx="224" cy="336" r="4.5"/><circle cx="348" cy="323" r="4.5"/><circle cx="472" cy="302" r="4.5"/><circle cx="596" cy="230.7" r="4.5"/><circle cx="720" cy="134" r="4.5"/></g>

  <text x="712" y="123" fill="#D97757" font-size="14" font-weight="600" text-anchor="end">Same examples, paired: 68%</text>
  <text x="712" y="216" fill="#FAF9F5" font-size="14" font-weight="600" text-anchor="end">Separate samples: 40%</text>
  <text x="358" y="305" fill="#D97757" font-size="13" font-weight="600">At 100 examples: 11%</text>
  <text x="358" y="354" fill="#FAF9F5" fill-opacity="0.85" font-size="13">unpaired: 7%</text>

  <text x="40" y="440" fill="#FAF9F5" fill-opacity="0.6" font-size="12">Paired data: outcome correlation 0.5 between the two systems. Bootstrap CI, 1,000 resamples. Source: simulate.py, seed 20261114.</text>
</svg>
