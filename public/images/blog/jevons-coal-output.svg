<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Bar chart of Britain's annual coal output in million tonnes: a ten-year average of 72 in 1853 to 1862, rising every decade to 258 in 1903 to 1912, and 292 in 1913, about four times the first figure."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="330" fill="#272725"/>
