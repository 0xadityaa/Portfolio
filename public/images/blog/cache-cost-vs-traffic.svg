<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d">
<title id="t">Cost per request against traffic, for no cache, a 5-minute cache and a 1-hour cache</title>
<desc id="d">Line chart on a log scale from 0.1 to 600 requests per hour. Without caching a 6,500-token request costs 1.3 cents. The 5-minute cache costs more than that below 2.8 requests per hour and falls to 0.16 cents at high traffic. The 1-hour cache costs more than no cache only below 0.72 requests per hour.</desc>
<rect width="900" height="540" fill="#30302E"/>
<text x="86" y="44" fill="#FAF9F5" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="600">Under 3 requests an hour, the 5-minute cache costs more than none</text>
<text x="86" y="72" fill="#A8A59A" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14">Input cost per request. Sonnet 5.5, 6,000 static + 500 per-request tokens, Poisson arrivals</text>
