<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Pairs of bars for the 100-step bill with caching off and on. No management falls from 20.43 dollars to 1.72. A sliding clear barely moves, from 7.61 dollars to 7.20, which is 4.2 times the cost of caching alone. Compacting every 25 steps falls from 7.48 dollars to 1.21."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="330" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Caching shrinks every bill but one</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Total for a 100-step run, caching off then on.</text></g><text class="a-fade" style="--d:0.40s;--t:0.4s" x="24" y="112" font-size="16" font-weight="500" fill="#FAF9F5">No management</text><text class="a-fade m" style="--d:0.50s;--t:0.4s" x="56" y="136" text-anchor="end" font-size="13" fill="#B5B3AA">off</text><rect class="a-growx" style="--d:0.50s;--t:0.6s" x="64.0" y="120" width="300.0" height="20" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:0.50s;--t:0.6s" data-count="20.43" data-dec="2" data-pre="$" x="372.0" y="136" font-size="15" fill="#FAF9F5">$20.43</text><text class="a-fade m" style="--d:0.75s;--t:0.4s" x="56" y="160" text-anchor="end" font-size="13" fill="#B5B3AA">on</text><rect class="a-growx" style="--d:0.75s;--t:0.6s" x="64.0" y="144" width="25.3" height="20" rx="2" fill="#FAF9F5"/><text class="a-fade m" style="--d:0.75s;--t:0.6s" data-count="1.72" data-dec="2" data-pre="$" x="97.3" y="160" font-size="15" fill="#FAF9F5">$1.72</text><text class="a-fade" style="--d:0.90s;--t:0.4s" x="24" y="186" font-size="16" font-weight="500" fill="#FAF9F5">Clear, sliding window</text><text class="a-fade m" style="--d:1.00s;--t:0.4s" x="56" y="210" text-anchor="end" font-size="13" fill="#B5B3AA">off</text><rect class="a-growx" style="--d:1.00s;--t:0.6s" x="64.0" y="194" width="111.7" height="20" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:1.00s;--t:0.6s" data-count="7.61" data-dec="2" data-pre="$" x="183.7" y="210" font-size="15" fill="#FAF9F5">$7.61</text><text class="a-fade m" style="--d:1.25s;--t:0.4s" x="56" y="234" text-anchor="end" font-size="13" fill="#B5B3AA">on</text><rect class="a-growx" style="--d:1.25s;--t:0.6s" x="64.0" y="218" width="105.7" height="20" rx="2" fill="#DB8061"/><text class="a-fade m" style="--d:1.25s;--t:0.6s" data-count="7.2" data-dec="2" data-pre="$" x="177.7" y="234" font-size="15" fill="#DB8061">$7.20</text><g class="a-fade" style="--d:2.0s;--t:.5s"><g class="a-pop" style="--d:2.2s;--t:.5s"><text x="247.7" y="234" font-size="15" font-weight="500" fill="#DB8061">4.2x caching alone</text></g></g><text class="a-fade" style="--d:1.40s;--t:0.4s" x="24" y="260" font-size="16" font-weight="500" fill="#FAF9F5">Compact every 25 steps</text><text class="a-fade m" style="--d:1.50s;--t:0.4s" x="56" y="284" text-anchor="end" font-size="13" fill="#B5B3AA">off</text><rect class="a-growx" style="--d:1.50s;--t:0.6s" x="64.0" y="268" width="109.8" height="20" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:1.50s;--t:0.6s" data-count="7.48" data-dec="2" data-pre="$" x="181.8" y="284" font-size="15" fill="#FAF9F5">$7.48</text><text class="a-fade m" style="--d:1.75s;--t:0.4s" x="56" y="308" text-anchor="end" font-size="13" fill="#B5B3AA">on</text><rect class="a-growx" style="--d:1.75s;--t:0.6s" x="64.0" y="292" width="17.8" height="20" rx="2" fill="#FAF9F5"/><text class="a-fade m" style="--d:1.75s;--t:0.6s" data-count="1.21" data-dec="2" data-pre="$" x="89.8" y="308" font-size="15" fill="#FAF9F5">$1.21</text></svg>
