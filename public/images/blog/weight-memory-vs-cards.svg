<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Weight memory at fp16, int8 and int4 against 24, 48 and 80 GB cards</title>
<desc id="d">Horizontal bars of weight memory in GiB for four models. Llama 3.1 8B is 15.0, 8.6 and 5.3 GiB at fp16, int8 and int4. Qwen2.5 14B is 27.5, 15.5 and 9.3. Qwen2.5 32B is 61.0, 32.6 and 18.0. Llama 3.1 70B is 131.4, 69.2 and 37.0. Dashed lines mark the 24, 48 and 80 GB cards. Llama 3.1 70B at int4 is the first 70B bar to fit a 48 GB card.</desc>
<rect width="900" height="600" fill="#30302E"/>
<text x="40" y="40" fill="#FAF9F5" font-size="20" font-weight="600">4-bit weights take a 70B model from two 80 GB cards to one</text>
<text x="40" y="64" fill="#FAF9F5" fill-opacity="0.7" font-size="13">Weight memory in GiB, group size 128, embeddings and output head kept in fp16. Dashed lines: card memory, before KV cache.</text>
