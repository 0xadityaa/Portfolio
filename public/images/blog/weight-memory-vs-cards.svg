<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 474" width="560" height="474" role="img" aria-label="Horizontal bars of weight memory in GiB at fp16, int8 and int4 for four models, with dashed lines for 24, 48 and 80 GB cards. Llama 3.1 70B falls from 131.4 GiB at fp16 to 37.0 at int4, which fits a 48 GB card."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="474" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">4-bit moves a 70B from two cards to one</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Weight memory in GiB, groups of 128, embeddings kept in fp16.</text></g><path class="a-fade" style="--d:.3s;--t:.5s" d="M229.4 100V436" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="m a-fade" style="--d:.4s;--t:.5s" x="229.4" y="92" text-anchor="middle" font-size="13" fill="#B5B3AA">24 GB</text><path class="a-fade" style="--d:.3s;--t:.5s" d="M280.8 100V436" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="m a-fade" style="--d:.4s;--t:.5s" x="280.8" y="92" text-anchor="middle" font-size="13" fill="#B5B3AA">48 GB</text><path class="a-fade" style="--d:.3s;--t:.5s" d="M349.4 100V436" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="m a-fade" style="--d:.4s;--t:.5s" x="349.4" y="92" text-anchor="middle" font-size="13" fill="#B5B3AA">80 GB</text><path class="a-draw" pathLength="1" style="--d:.15s;--t:.5s" d="M178 100V436" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:0.40s;--t:.4s" x="24" y="149" font-size="15" fill="#FAF9F5">Llama 3.1 8B</text><text class="m a-fade" style="--d:0.50s;--t:.4s" x="170" y="124" text-anchor="end" font-size="13" fill="#B5B3AA">fp16</text><rect class="a-growx" st