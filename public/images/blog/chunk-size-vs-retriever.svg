<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 224" width="560" height="224" role="img" aria-label="Bars of recall change at a 2,000-token budget in points. Changing chunk size moves BM25 by 5.3 points and the embedding model by 5.9 over the sizes it reads in full. Swapping the retriever, each at its best size, moves it by 2.1."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="224" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Chunk size moves recall more than the retriever</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Recall change in points, 2,000-token budget.</text></g><path class="a-draw" pathLength="1" style="--d:.15s;--t:.5s" d="M214 90V186" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:0.50s;--t:.4s" x="204" y="115" text-anchor="end" font-size="15" fill="#FAF9F5">BM25, sizes 64 to 1,024</text><rect class="a-growx" style="--d:0.50s;--t:.6s" x="214" y="98" width="190.8" height="24" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="5.3" data-dec="1" data-suf=" pts" style="--d:0.50s;--t:.6s" x="412.8" y="115" font-size="14" fill="#FAF9F5">5.3 pts</text><text class="a-fade" style="--d:0.85s;--t:.4s" x="204" y="147" text-anchor="end" font-size="15" fill="#FAF9F5">Embeddings, sizes 64 to 256</text><rect class="a-growx" style="--d:0.85s;--t:.6s" x="214" y="130" width="212.4" height="24" rx="2" fill="#DB8061"/><text class="m a-fade" data-count="5.9" data-dec="1" data-suf=" pts" style="--d:0.85s;--t:.6s" x="434.4" y="147" font-size="14" fill="#DB8061">5.9 pts</text><text class="a-fade" style="--d:1.20s;--t:.4s" x="204" y="179" text-anchor="end" font-size="15" fill="#FAF9F5">Swapping the retriever</text><rect class="a-growx" style="--d:1.20s;--t:.6s" x="214" y="162" width="75.6" height="24" rx="2" fill="#FAF9F5"/><text class="m a-fade" data-count="2.1" data-dec="1" data-suf=" pts" style="--d:1.20s;--t:.6s" x="297.6" y="179" font-size="14" fill="#FAF9F5">2.1 pts</text><text class="a-fade" style="--d:1.6s;--t:.5s" x="24" y="212" font-size="13" fill="#B5B3AA">The embedding model reads 512 tokens at most, so 512 and 1,024 are left out.</text></svg>
