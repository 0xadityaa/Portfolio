<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-label="Diagram: with folders the note sits behind a wall the search never crosses; with views there is one store and the origin only adjusts rank"><rect width="940" height="390" fill="#30302E"/><text x="40" y="36" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#FAF9F5">Same note, same question, two data models</text><rect x="40" y="60" width="410" height="300" rx="10" fill="none" stroke="#4A4A45" stroke-width="1.5"/><text x="64" y="92" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#FAF9F5">Folders: a wall</text><rect x="64" y="120" width="170" height="110" rx="10" fill="none" stroke="#FAF9F5" stroke-width="2"/><text x="149" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FAF9F5">acme/payments</text><circle cx="149" cy="178" r="7" fill="#FAF9F5"/><text x="149" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#B0AEA5">the note lives here</text><rect x="256" y="120" width="170" height="110" rx="10" fill="none" stroke="#FAF9F5" stroke-width="2"/><text x="341" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FAF9F5">chatgpt.com</text><text x="341" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#B0AEA5">the search looks here</text><path d="M245 108V242" stroke="#D97757" stroke-width="3" stroke-linecap="round"/><path d="M341 292L341 238M344.5 245.2L341 238L337.5 245.2" fill="none" stroke="#B0AEA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="341" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#B0AEA5">your question</text><text x="245" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#D97757">Nothing comes back. The note is never even scored.</text><rect x="490" y="60" width="410" height="300" rx="10" fill="none" stroke="#4A4A45" stroke-width="1.5"/><text x="514" y="92" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#FAF9F5">Views: a weight</text><rect x="514" y="120" width="362" height="110" rx="10" fill="none" stroke="#FAF9F5" stroke-width="2"/><text x="695" y="146" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#FAF9F5">one store, everything searched</text><circle cx="600" cy="182" r="7" fill="#FAF9F5"/><text x="616" y="187" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#B0AEA5">written in acme/payments</text><path d="M791 292L791 238M794.5 245.2L791 238L787.5 245.2" fill="none" stroke="#B0AEA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="791" y="312" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#B0AEA5">your question</text><text x="695" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#FAF9F5">Found. Where it was written only nudges the rank.</text></svg>
