<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 348" width="560" height="348" role="img" aria-label="Two lanes. With folders, a note filed under acme/payments is hidden from a query asked from chatgpt.com because the folder filter runs first and returns 0 notes. With views, the same query searches everything and finds the note."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="348" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">The wall and the weight</text><text x="24" y="66" font-size="15" fill="#B5B3AA">A note about the Stripe migration, asked about from another tool.</text></g><g class="a-fade" style="--d:0.3s;--t:0.4s"><text x="24" y="102" font-size="15" fill="#B5B3AA">Folders</text></g><g class="a-fade" style="--d:0.4s;--t:0.4s"><rect x="24.75" y="112.75" width="188.5" height="50.5" rx="4" fill="none" stroke="#DB8061" stroke-width="1.5"/><text x="38" y="135" font-size="15" fill="#FAF9F5">Migrating off Stripe</text><text class="m" x="38" y="154" font-size="13" fill="#B5B3AA">filed in acme/payments</text></g><g class="a-fade" style="--d:0.6s;--t:0.4s"><rect x="346.75" y="112.75" width="188.5" height="50.5" rx="4" fill="none" stroke="#B5B3AA" stroke-width="1.5"/><text x="360" y="135" font-size="15" fill="#FAF9F5">Stripe migration?</text><text class="m" x="360" y="154" font-size="13" fill="#B5B3AA">asked from chatgpt.com</text></g><path class="a-draw" pathLength="1" style="--d:1.0s;--t:0.5s" d="M338 138H300" fill="none" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="a-draw" pathLength="1" style="--d:1.4s;--t:0.3s" d="M278 118V158" fill="none" stroke="#FAF9F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="a-fade" style="--d:1.7s;--t:0.4s"><text x="24" y="192" font-size="15" fill="#B5B3AA">The folder filter runs before ranking.</text><text class="m" x="536" y="192" text-anchor="end" font-size="15" fill="#FAF9F5">0 notes</text></g><path class="a-fade" style="--d:1.8s;--t:.4s" d="M24 212H536" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><g class="a-fade" style="--d:1.9s;--t:0.4s"><text x="24" y="246" font-size="15" fill="#FAF9F5">Views</text></g><g class="a-fade" style="--d:2.0s;--t:0.4s"><rect x="24.75" y="256.75" width="188.5" height="50.5" rx="4" fill="none" stroke="#DB8061" stroke-width="1.5"/><text x="38" y="279" font-size="15" fill="#FAF9F5">Migrating off Stripe</text><text class="m" x="38" y="298" font-size="13" fill="#B5B3AA">origin acme/payments</text></g><g class="a-fade" style="--d:2.1s;--t:0.4s"><rect x="346.75" y="256.75" width="188.5" height="50.5" rx="4" fill="none" stroke="#B5B3AA" stroke-width="1.5"/><text x="360" y="279" font-size="15" fill="#FAF9F5">Stripe migration?</text><text class="m" x="360" y="298" font-size="13" fill="#B5B3AA">asked from chatgpt.com</text></g><path class="a-draw" pathLength="1" style="--d:2.4s;--t:0.5s" d="M338 282H222" fill="none" stroke="#DB8061" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="a-fade" style="--d:2.8s;--t:0.4s"><text x="24" y="336" font-size="15" fill="#B5B3AA">One space. Origin nudges the rank, never hides.</text><text class="m" x="536" y="336" text-anchor="end" font-size="15" fill="#DB8061">1 note found</text></g></svg>
