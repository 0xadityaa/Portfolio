<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 270" width="560" height="270" role="img" aria-label="Bar chart of the 75 bf16 flips by the gap between the top two logits where the text first split: 43 at 0.000, 30 at 0.125 and 2 at 0.250."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="270" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Every flip began at a near tie</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Gap between the top two logits at the first differing token, bf16.</text></g><rect class="a-growy" style="--d:0.60s;--t:.6s" x="116" y="102.2" width="68" height="111.8" rx="2" fill="#DB8061"/><text class="m a-fade" data-count="43" style="--d:0.60s;--t:.6s" x="150" y="94.2" text-anchor="middle" font-size="15" fill="#DB8061">43</text><text class="m a-fade" style="--d:0.60s;--t:.4s" x="150" y="236" text-anchor="middle" font-size="14" fill="#B5B3AA">0.000</text><rect class="a-growy" style="--d:0.85s;--t:.6s" x="246" y="136.0" width="68" height="78.0" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="30" style="--d:0.85s;--t:.6s" x="280" y="128.0" text-anchor="middle" font-size="15" fill="#FAF9F5">30</text><text class="m a-fade" style="--d:0.85s;--t:.4s" x="280" y="236" text-anchor="middle" font-size="14" fill="#B5B3AA">0.125</text><rect class="a-growy" style="--d:1.10s;--t:.6s" x="376" y="208.8" width="68" height="5.2" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="2" style="--d:1.10s;--t:.6s" x="410" y="200.8" text-anchor="middle" font-size="15" fill="#FAF9F5">2</text><text class="m a-fade" style="--d:1.10s;--t:.4s" x="410" y="236" text-anchor="middle" font-size="14" fill="#B5B3AA">0.250</text><path class="a-draw" pathLength="1" style="--d:.15s;--t:.5s" d="M96 214H464" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:1.4s;--t:.4s" x="280" y="258" text-anchor="middle" font-size="13" fill="#B5B3AA">one bf16 step at these logits is 0.125</text></svg>