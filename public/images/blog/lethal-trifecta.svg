<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 384" width="560" height="384" role="img" aria-label="Three overlapping circles: private data, untrusted content, and a way to send data out. Only where all three overlap can an injected instruction leak data; remove any one circle and the leak is closed."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="384" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">A leak needs all three</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Take away any one and nothing leaves.</text></g><defs><clipPath id="ca"><circle cx="215" cy="175" r="84"/></clipPath><clipPath id="cb"><circle cx="315" cy="175" r="84"/></clipPath></defs><g class="a-fade" style="--d:1.6s;--t:.5s"><g clip-path="url(#ca)"><g clip-path="url(#cb)"><circle cx="265" cy="262" r="84" fill="#DB8061"/></g></g></g><circle class="a-draw" pathLength="1" style="--d:0.3s;--t:.9s" cx="215" cy="175" r="84" fill="none" stroke="#B5B3AA" stroke-width="1.5"/><circle class="a-draw" pathLength="1" style="--d:0.6s;--t:.9s" cx="315" cy="175" r="84" fill="none" stroke="#B5B3AA" stroke-width="1.5"/><circle class="a-draw" pathLength="1" style="--d:0.9s;--t:.9s" cx="265" cy="262" r="84" fill="none" stroke="#B5B3AA" stroke-width="1.5"/><text class="a-fade" style="--d:0.90s;--t:0.5s" x="123" y="180" text-anchor="end" font-size="16" font-weight="500" fill="#FAF9F5">Private data</text><text class="a-fade" style="--d:1.20s;--t:0.5s" x="411" y="180" font-size="16" font-weight="500" fill="#FAF9F5">Untrusted content</text><text class="a-fade" style="--d:1.50s;--t:0.5s" x="265" y="372" text-anchor="middle" font-size="16" font-weight="500" fill="#FAF9F5">A way to send data out</text><g class="a-fade" style="--d:2.1s;--t:.5s"><path d="M273 206L408 268" stroke="#DB8061" stroke-width="1.5" stroke-linecap="round" fill="none"/><g class="a-pop" style="--d:2.3s;--t:.5s"><text x="416" y="276" font-size="16" font-weight="500" fill="#DB8061">All three:</text><text x="416" y="298" font-size="16" font-weight="500" fill="#DB8061">data leaks</text></g></g></svg>
