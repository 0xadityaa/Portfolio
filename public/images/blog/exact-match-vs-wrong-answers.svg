<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-label="Bar chart: for each way of scoring an answer against a reference, the share of correct human answers it fails and the share of hand-written wrong answers it passes. Exact match fails 18% of correct answers and passes 0% of wrong ones. F1 at 0.5 fails 6% and passes 74%. Cosine at 0.90 fails 12% and passes 37%. No setting is low on both."><rect width="940" height="520" fill="#30302E"/><text x="40" y="36" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#FAF9F5">Every way of scoring is wrong somewhere</text><rect x="40" y="56" width="12" height="12" fill="#B0AEA5"/><text x="60" y="67" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#FAF9F5">correct human answers it fails (n = 34,723)</text><rect x="400" y="56" width="12" height="12" fill="#D97757"/><text x="420" y="67" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#D97757">wrong answers it passes (n = 100, hand-written)</text><path d="M190.0 88V482" stroke="#4A4A45" stroke-width="1"/><text x="190.0" y="502" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B0AEA5">0%</text><path d="M362.5 88V482" stroke="#4A4A45" stroke-width="1"/><text x="362.5" y="502" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B0AEA5">25%</text><path d="M535.0 88V482" stroke="#4A4A45" stroke-width="1"/><text x="535.0" y="502" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B0AEA5">50%</text><path d="M707.5 88V482" stroke="#4A4A45" stroke-width="1"/><text x="707.5" y="502" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B0AEA5">75%</text><path d="M880.0 88V482" stroke="#4A4A