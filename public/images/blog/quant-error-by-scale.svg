<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 334" width="560" height="334" role="img" aria-label="Bars of output error for round-to-nearest quantization of Qwen2.5-0.5B. At 8 bits the error is 3.51, 0.64 and 0.49 percent for per tensor, per channel and groups of 128. At 4 bits it is 50.68, 10.79 and 8.21 percent, and perplexity is 10,816,108, 31.76 and 20.49."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="334" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">At 4 bits, group size decides the outcome</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Qwen2.5-0.5B, round to nearest. fp32 perplexity is 17.17.</text></g><text class="a-fade" style="--d:.3s;--t:.4s" x="168" y="100" font-size="13" fill="#B5B3AA">output error</text><text class="a-fade" style="--d:.3s;--t:.4s" x="536" y="100" text-anchor="end" font-size="13" fill="#B5B3AA">perplexity</text><path class="a-draw" pathLength="1" style="--d:.15s;--t:.5s" d="M168 108V306" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:0.50s;--t:.4s" x="158" y="131" text-anchor="end" font-size="15" fill="#FAF9F5">int8 per tensor</text><rect class="a-growx" style="--d:0.50s;--t:.6s" x="168" y="114" width="14.5" height="24" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="3.51" data-dec="2" data-suf="%" style="--d:0.50s;--t:.6s" x="190.5" y="131" font-size="14" fill="#FAF9F5">3.51%</text><g class="a-fade" style="--d:0.90s;--t:.4s"><text class="m" x="536" y="131" text-anchor="end" font-size="14" fill="#B5B3AA">17.75</text></g><text class="a-fade" style="--d:0.70s;--t:.4s" x="158" y="163" text-anchor="end" font-size="15" fill="#FAF9F5">int8 per channel</text><rect class="a-growx" style="--d:0.70s;--t:.6s"