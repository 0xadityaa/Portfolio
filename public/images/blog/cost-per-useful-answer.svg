<title id="t">Cost per useful answer against the cost of a wrong answer</title>
<desc id="d">Line chart. A cheap model alone gets expensive fast as the cost of a wrong answer rises, and crosses the expensive model alone at about 0.11 dollars. A cascade with a good verifier stays lowest from about 3 cents up; a cascade whose verifier passes half of wrong answers climbs above the expensive model alone.</desc>
