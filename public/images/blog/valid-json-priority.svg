<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Bars of how often priority is right in four setups: 30.0, 31.7, 30.8 and 33.3 percent. Always answering medium would score 40 percent and always answering high 30 percent, so every setup sits at or below the best constant guess."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="330" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Every setup loses to a constant guess</text><text x="24" y="66" font-size="15" fill="#B5B3AA">How often priority is right, of 120 messages.</text></g><text class="a-fade m" style="--d:0.40s;--t:0.5s" x="176.0" y="300" text-anchor="middle" font-size="13" fill="#B5B3AA">0%</text><path class="a-fade" style="--d:0.3s;--t:.5s" d="M326.0 112V280" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="a-fade m" style="--d:0.40s;--t:0.5s" x="326.0" y="300" text-anchor="middle" font-size="13" fill="#B5B3AA">25%</text><path class="a-fade" style="--d:0.3s;--t:.5s" d="M476.0 112V280" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="a-fade m" style="--d:0.40s;--t:0.5s" x="476.0" y="300" text-anchor="middle" font-size="13" fill="#B5B3AA">50%</text><path class="a-draw" pathLength="1" style="--d:0.15s;--t:.5s" d="M176 104V280" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:0.50s;--t:0.4s" x="164" y="134" text-anchor="end" font-size="15" fill="#FAF9F5">Instruction only</text><rect class="a-growx" style="--d:0.50s;--t:0.6s" x="176.0" y="118" width="180.0" height="22" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:0.50s;--t:0.6s" data-count="30" data-dec="1" data-suf="%" x="348.0" y="135" text-anchor="end" font-size="15" fill="#272725">30.0%</text><text class="a-fade" style="--d:0.80s;--t:0.4s" x="164" y="174" text-anchor="end" font-size="15" fill="#FAF9F5">3-shot</text><rect class="a-growx" style="--d:0.80s;--t:0.6s" x="176.0" y="158" width="190.2" height="22" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:0.80s;--t:0.6s" data-count="31.7" data-dec="1" data-suf="%" x="358.2" y="175" text-anchor="end" font-size="15" fill="#272725">31.7%</text><text class="a-fade" style="--d:1.10s;--t:0.4s" x="164" y="214" text-anchor="end" font-size="15" fill="#FAF9F5">Constrained</text><rect class="a-growx" style="--d:1.10s;--t:0.6s" x="176.0" y="198" width="184.8" height="22" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:1.10s;--t:0.6s" data-count="30.8" data-dec="1" data-suf="%" x="352.8" y="215" text-anchor="end" font-size="15" fill="#272725">30.8%</text><text class="a-fade" style="--d:1.40s;--t:0.4s" x="164" y="254" text-anchor="end" font-size="15" fill="#FAF9F5">3-shot + constrained</text><rect class="a-growx" style="--d:1.40s;--t:0.6s" x="176.0" y="238" width="199.8" height="22" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:1.40s;--t:0.6s" data-count="33.3" data-dec="1" data-suf="%" x="367.8" y="255" text-anchor="end" font-size="15" fill="#272725">33.3%</text><g class="a-fade" style="--d:1.8s;--t:.5s"><path d="M416.0 108V280" stroke="#DB8061" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/><text x="416.0" y="98" text-anchor="middle" font-size="15" font-weight="500" fill="#DB8061">always medium: 40%</text></g></svg>
