<circle class="a-draw" pathLength="1" style="--d:.8s;--t:1.2s" cx="130" cy="124" r="98" transform="rotate(-90 130 124)" fill="none" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round"/>
<g class="a-fade" style="--d:1.9s;--t:.4s"><path d="M174 112H262" stroke="#DB8061" stroke-width="1.5" fill="none"/><text x="274" y="84" font-size="17" font-weight="500" fill="#DB8061">Up to me</text><text x="274" y="108" font-size="15" fill="#FAF9F5">the hours, the care,</text><text x="274" y="128" font-size="15" fill="#FAF9F5">showing up again</text></g>
<g class="a-fade" style="--d:2.2s;--t:.4s"><path d="M215 173L262 190" stroke="#B5B3AA" stroke-width="1.5" fill="none"/><text x="274" y="170" font-size="17" font-weight="500" fill="#B5B3AA">Not up to me</text><text x="274" y="194" font-size="15" fill="#FAF9F5">the algorithm, applause,</text><text x="274" y="214" font-size="15" fill="#FAF9F5">reputation</text></g>
<text class="m a-fade" style="--d:2.5s;--t:.4s" x="24" y="266" font-size="13" fill="#B5B3AA">after Epictetus, Enchiridion 1</text>
