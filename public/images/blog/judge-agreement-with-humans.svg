<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 270" width="560" height="270" role="img" aria-label="Horizontal bars of agreement with human votes for the 0.5B judge on 825 pairs: 51.4 percent from one order, 63.2 percent with both orders subtracted, 73.2 percent for always picking the longer answer, 82.6 percent between two humans."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="270" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">A coin, until you swap the orders</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Qwen2.5-0.5B as judge, 825 pairs, 1,106 human votes.</text></g><text class="m a-fade" style="--d:.4s;--t:.5s" x="190.0" y="256" text-anchor="middle" font-size="13" fill="#B5B3AA">0%</text><path class="a-fade" style="--d:.3s;--t:.5s" d="M340.0 96V232" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="m a-fade" style="--d:.4s;--t:.5s" x="340.0" y="256" text-anchor="middle" font-size="13" fill="#B5B3AA">50%</text><path class="a-fade" style="--d:.3s;--t:.5s" d="M490.0 96V232" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="m a-fade" style="--d:.4s;--t:.5s" x="490.0" y="256" text-anchor="middle" font-size="13" fill="#B5B3AA">100%</text><path class="a-draw" pathLength="1" style="--d:.15s;--t:.5s" d="M190 92V232" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><path class="a-draw" pathLength="1" style="--d:.5s;--t:.5s" d="M340.0 92V232" stroke="#FAF9F5" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".7"/><text class="a-fade" style="--d:.6s;--t:.4s" x="346.0" y="88" font-size="13" fill="#B5B3AA">coin</text><text class="a-fade" style="--d:0.60s;--t:.4s" x="178" y="119" text-anchor="end" font-size="15" fill="#FAF9F5">One order</text><rect class="a-growx" style="--d:0.60s;--t:.6s" x="190" y="100" width="154.2" height="26" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="51.4" data-dec="1" data-suf="%" style="--d:0.60s;--t:.6s" x="352.2" y="119" font-size="15" fill="#FAF9F5">51.4%</text><text class="a-fade" style="--d:0.85s;--t:.4s" x="178" y="153" text-anchor="end" font-size="15" fill="#FAF9F5">Both orders</text><rect class="a-growx" style="--d:0.85s;--t:.6s" x="190" y="134" width="189.6" height="26" rx="2" fill="#DB8061"/><text class="m a-fade" data-count="63.2" data-dec="1" data-suf="%" style="--d:0.85s;--t:.6s" x="387.6" y="153" font-size="15" fill="#DB8061">63.2%</text><text class="a-fade" style="--d:1.10s;--t:.4s" x="178" y="187" text-anchor="end" font-size="15" fill="#FAF9F5">Longer answer</text><rect class="a-growx" style="--d:1.10s;--t:.6s" x="190" y="168" width="219.6" height="26" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="73.2" data-dec="1" data-suf="%" style="--d:1.10s;--t:.6s" x="417.6" y="187" font-size="15" fill="#FAF9F5">73.2%</text><text class="a-fade" style="--d:1.35s;--t:.4s" x="178" y="221" text-anchor="end" font-size="15" fill="#FAF9F5">Human vs human</text><rect class="a-growx" style="--d:1.35s;--t:.6s" x="190" y="202" width="247.8" height="26" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="82.6" data-dec="1" data-suf="%" style="--d:1.35s;--t:.6s" x="445.8" y="221" font-size="15" fill="#FAF9F5">82.6%</text></svg>