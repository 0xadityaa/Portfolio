<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="Diagram: saved notes are searched, the relevant few are pasted into the prompt with your question, and a stateless model reads the result"><rect width="940" height="360" fill="#30302E"/><text x="40" y="40" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#FAF9F5">What a memory feature actually does</text><rect x="40" y="90" width="150" height="64" rx="10" fill="none" stroke="#FAF9F5" stroke-width="2"/><text x="115.0" y="127.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#FAF9F5">Your question</text><rect x="40" y="220" width="150" height="64" rx="10" fill="none" stroke="#FAF9F5" stroke-width="2"/><text x="115.0" y="248.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#FAF9F5">Saved notes</text><text x="115.0" y="267.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#B0AEA5">the app's database</text><rect x="270" y="155" width="170" height="64" rx="10" fill="none" stroke="#D97757" stroke-width="2"/><text x="355.0" y="183.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#FAF9F5">Search</text><text x="355.0" y="202.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#B0AEA5">pick the relevant few</text><rect x="520" y="155" width="170" height="64" rx="10" fill="none" stroke="#FAF9F5" stroke-width="2"/><text x="605.0" y="183.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#FAF9F5">Prompt</text><text x="605.0" y="202.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#B0AEA5">notes + your question</text><rect x="770" y="155" width="130" height="64" rx="10" fill="none" stroke="#FAF9F5" stroke-width="2"/><text x="835.0" y="183.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#FAF9F5">Model</text><text x="835.0" y="202.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#B0AEA5">stateless</text><path d="M190 122L270 172M262.0 171.1L270 172L265.7 165.2" fill="none" stroke="#FAF9F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 252L270 202M265.7 208.8L270 202L262.0 202.9" fill="none" stroke="#FAF9F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 187L520 187M512.8 190.5L520 187L512.8 183.5" fill="none" stroke="#D97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 187L770 187M762.8 190.5L770 187L762.8 183.5" fill="none" stroke="#FAF9F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#D97757">paste</text><text x="835" y="250" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#B0AEA5">remembers</text><text x="835" y="267" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#B0AEA5">nothing</text><text x="40" y="330" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#B0AEA5">The model never changes. The only thing that differs between a tool that knows you and one that doesn't is the paste.</text></svg>
