<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 352" width="560" height="352" role="img" aria-label="A saved note, Runs Postgres 16 in staging, is found by search and pasted above the user's question before one prompt goes to a model that keeps nothing between calls."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="352" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Memory is a search and a paste</text><text x="24" y="66" font-size="15" fill="#B5B3AA">The model only ever sees the one prompt.</text></g><g class="a-fade" style="--d:0.3s;--t:0.4s"><text x="24" y="96" font-size="13" fill="#B5B3AA">saved notes in the app's database</text></g><g class="a-fade" style="--d:0.4s;--t:0.4s"><rect x="24.75" y="106.75" width="150" height="30" rx="4" fill="none" stroke="#474743" stroke-width="1.5"/><text x="38" y="127" font-size="14" fill="#B5B3AA">Prefers TypeScript</text></g><g class="a-fade" style="--d:0.55s;--t:0.4s"><rect x="187.75" y="106.75" width="232" height="30" rx="4" fill="none" stroke="#DB8061" stroke-width="1.5"/><text x="201" y="127" font-size="14" fill="#FAF9F5">Runs Postgres 16 in staging</text></g><path class="a-draw" pathLength="1" style="--d:0.9s;--t:0.5s" d="M304 144V176" fill="none" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="a-draw" pathLength="1" style="--d:1.2s;--t:0.2s" d="M298 170L304 177L310 170" fill="none" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="a-fade" style="--d:1.0s;--t:0.4s"><text x="320" y="165" font-size="14" fill="#B5B3AA">search picks the notes that fit</text></g><rect class="a-fade" style="--d:1.3s;--t:.4s" x="24.75" y="184.75" width="510.5" height="92" rx="6" fill="none" stroke="#B5B3AA" stroke-width="1.5"/><g class="a-fade" style="--d:1.5s;--t:0.4s"><rect x="40" y="198" width="232" height="30" rx="4" fill="#DB8061"/><text x="53" y="218" font-size="14" font-weight="500" fill="#272725">Runs Postgres 16 in staging</text><text x="284" y="218" font-size="14" fill="#B5B3AA">pasted in, never shown to you</text></g><g class="a-fade" style="--d:1.8s;--t:0.4s"><text x="40" y="258" font-size="16" fill="#FAF9F5">Which Postgres version are we on?</text></g><path class="a-draw" pathLength="1" style="--d:2.1s;--t:0.4s" d="M280 284V304" fill="none" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="a-draw" pathLength="1" style="--d:2.4s;--t:0.2s" d="M274 298L280 305L286 298" fill="none" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><g class="a-fade" style="--d:2.2s;--t:0.4s"><text x="296" y="299" font-size="14" fill="#B5B3AA">one call, no history</text></g><g class="a-fade" style="--d:2.5s;--t:0.4s"><rect x="24.75" y="312.75" width="510.5" height="28" rx="4" fill="none" stroke="#474743" stroke-width="1.5"/><text x="38" y="332" font-size="15" fill="#FAF9F5">Model</text><text x="522" y="332" text-anchor="end" font-size="14" fill="#B5B3AA">keeps nothing after it answers</text></g></svg>
