<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 370" width="560" height="370" role="img" aria-label="At a 0.85 threshold a MiniLM semantic cache hits 32% of Quora question pairs and 28% of those hits return the answer to a different question."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="370" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Raise the threshold, keep the false hits</text><text x="24" y="66" font-size="15" fill="#B5B3AA">MiniLM cache on 5,000 Quora pairs: hits as a share of all pairs.</text></g><path class="a-draw" pathLength="1" style="--d:.2s;--t:.5s" d="M96 84V324" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="m a-fade" style="--d:0.4s;--t:.4s" x="86" y="119" text-anchor="end" font-size="15" fill="#FAF9F5">0.70</text><rect class="a-growx" style="--d:0.4s;--t:.6s" x="96" y="100" width="149.8" height="26" rx="2" fill="#B5B3AA"/><rect class="a-growx" style="--d:0.7s;--t:.5s" x="245.8" y="100" width="99.7" height="26" rx="2" fill="#DB8061"/><text class="m a-fade" style="--d:1.0s;--t:.4s" x="353.5" y="119" font-size="14" fill="#FAF9F5">58% hit, 40% wrong</text><text class="m a-fade" style="--d:0.65s;--t:.4s" x="86" y="163" text-anchor="end" font-size="15" fill="#FAF9F5">0.80</text><rect class="a-growx" style="--d:0.65s;--t:.6s" x="96" y="144" width="120.8" height="26" rx="2" fill="#B5B3AA"/><rect class="a-growx" style="--d:0.95s;--t:.5s" x="216.8" y="144" width="59.7" height="26" rx="2" fill="#DB8061"/><text class="m a-fade" style="--d:1.25s;--t:.4s" x="284.5" y="163" font-size="14" fill="#FAF9F5">42% hit, 33% wrong</text><text class="m a-fade" style="--d:0.9s;--t:.4s" x="86" y="207" text-anchor="end" font-size="15" fill="#FAF9F5">0.85</text><rect class="a-growx" style="--d:0.9s;--t:.6s" x="96" y="188" width="98.4" height="26" rx="2" fill="#B5B3AA"/><rect class="a-growx" style="--d:1.2s;--t:.5s" x="194.4" y="188" width="37.8" height="26" rx="2" fill="#DB8061"/><text class="m a-fade" style="--d:1.5s;--t:.4s" x="240.1" y="207" font-size="14" fill="#FAF9F5">32% hit, 28% wrong</text><text class="m a-fade" style="--d:1.15s;--t:.4s" x="86" y="251" text-anchor="end" font-size="15" fill="#FAF9F5">0.90</text><rect class="a-growx" style="--d:1.15s;--t:.6s" x="96" y="232" width="68.3" height="26" rx="2" fill="#B5B3AA"/><rect class="a-growx" style="--d:1.45s;--t:.5s" x="164.3" y="232" width="18.3" height="26" rx="2" fill="#DB8061"/><text class="m a-fade" style="--d:1.75s;--t:.4s" x="190.6" y="251" font-size="14" fill="#FAF9F5">20% hit, 21% wrong</text><text class="m a-fade" style="--d:1.4s;--t:.4s" x="86" y="295" text-anchor="end" font-size="15" fill="#FAF9F5">0.95</text><rect class="a-growx" style="--d:1.4s;--t:.6s" x="96" y="276" width="32.2" height="26" rx="2" fill="#B5B3AA"/><rect class="a-growx" style="--d:1.7s;--t:.5s" x="128.2" y="276" width="5.2" height="26" rx="2" fill="#DB8061"/><text class="m a-fade" style="--d:2.0s;--t:.4s" x="141.5" y="295" font-size="14" fill="#FAF9F5">9% hit, 14% wrong</text><rect class="a-fade" style="--d:2s;--t:.4s" x="96" y="334" width="12" height="12" rx="2" fill="#B5B3AA"/><text class="a-fade" style="--d:2s;--t:.4s" x="114" y="345" font-size="13" fill="#B5B3AA">right answer</text><rect class="a-fade" style="--d:2s;--t:.4s" x="216" y="334" width="12" height="12" rx="2" fill="#DB8061"/><text class="a-fade" style="--d:2s;--t:.4s" x="234" y="345" font-size="13" fill="#B5B3AA">wrong answer (labelled non-duplicate)</text></svg>
