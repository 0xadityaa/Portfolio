<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-label="Bar chart: tool definitions from 1, 3, 5 and 10 MCP servers cost 2,925, 5,150, 10,417 and 23,895 tokens on every request, against a 2,000-token example prompt for scale"><rect width="940" height="380" fill="#30302E"/><text x="40" y="40" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#FAF9F5">Tokens of tool definitions sent before you type anything</text><text x="40" y="62" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#B0AEA5">tools/list from real servers, counted with tiktoken o200k_base (a proxy)</text><g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#FAF9F5"><text x="40" y="105">1 server</text><text x="40" y="155">3 servers</text><text x="40" y="205">5 servers</text><text x="40" y="255">10 servers</text><text x="40" y="320" fill="#B0AEA5">for scale</text></g><rect x="150" y="86" width="73" height="26" rx="4" fill="none" stroke="#FAF9F5" stroke-width="2"/><rect x="150" y="136" width="129" height="26" rx="4" fill="none" stroke="#FAF9F5" stroke-width="2"/><rect x="150" y="186" width="260" height="26" rx="4" fill="none" stroke="#FAF9F5" stroke-width="2"/><rect x="150" y="236" width="597" height="26" rx="4" fill="#D97757" stroke="#D97757" stroke-width="2"/><rect x="150" y="301" width="50" height="26" rx="4" fill="none" stroke="#B0AEA5" stroke-width="2" stroke-dasharray="4 3"/><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FAF9F5"><text x="233" y="104">2,925</text><text x="289" y="154">5,150</text><text x="420" y="204">10,417</text><text x="757" y="254" fill="#D97757">23,895</text><text x="210" y="319" fill="#B0AEA5">2,000: a short prompt I assumed</text></g><text x="40" y="360" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#B0AEA5">Ten servers cost about twelve times the prompt, on every request.</text></svg>
