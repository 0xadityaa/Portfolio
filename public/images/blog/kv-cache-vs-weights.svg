<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 290" width="560" height="290" role="img" aria-label="One bar of GPU memory on an 80 GB card, which is 74.5 GiB: 15.0 GiB of Llama 3.1 8B weights, then four 128k-token users at 16 GiB each. Users 1 to 3 fit and user 4 runs past the limit."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="290" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Four 128k users don't fit in 80 GB</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Llama 3.1 8B in fp16: 15.0 GiB of weights, 16 GiB of KV cache per user.</text></g><rect class="a-growx" style="--d:.2s;--t:.5s" x="24.0" y="128" width="96.0" height="44" rx="2" fill="#FAF9F5"/><text class="m a-fade" style="--d:0.5s;--t:0.4s" x="32.0" y="147" font-size="13" font-weight="500" fill="#272725">weights</text><text class="m a-fade" style="--d:0.5s;--t:0.4s" x="32.0" y="164" font-size="13" fill="#272725">15.0</text><rect class="a-growx" style="--d:0.45s;--t:.45s" x="120.0" y="128" width="102.4" height="44" rx="2" fill="#B5B3AA" stroke="#272725" stroke-width="1.5"/><text class="m a-fade" style="--d:0.65s;--t:0.4s" x="128.0" y="147" font-size="13" font-weight="500" fill="#272725">user 1</text><text class="m a-fade" style="--d:0.65s;--t:0.4s" x="128.0" y="164" font-size="13" fill="#272725">16.0</text><rect class="a-growx" style="--d:0.65s;--t:.45s" x="222.4" y="128" width="102.4" height="44" rx="2" fill="#B5B3AA" stroke="#272725" stroke-width="1.5"/><text class="m a-fade" style="--d:0.8500000000000001s;--t:0.4s" x="230.4" y="147" font-size="13" font-weight="500" fill="#272725">user 2</text><text class="m a-fade" style="--d:0.8500000000000001s;--t:0.4s" x="230.4" y="164" font-size="13" fill="#272725">16.0</text><rect class="a-growx" style="--d:0.85s;--t:.45s" x="324.8" y="128" width="102.4" height="44" rx="2" fill="#B5B3AA" stroke="#272725" stroke-width="1.5"/><text class="m a-fade" style="--d:1.05s;--t:0.4s" x="332.8" y="147" font-size="13" font-weight="500" fill="#272725">user 3</text><text class="m a-fade" style="--d:1.05s;--t:0.4s" x="332.8" y="164" font-size="13" fill="#272725">16.0</text><rect class="a-growx" style="--d:1.05s;--t:.45s" x="427.2" y="128" width="73.6" height="44" rx="2" fill="#B5B3AA" stroke="#272725" stroke-width="1.5"/><rect class="a-growx" style="--d:1.35s;--t:.35s" x="500.8" y="128" width="28.8" height="44" rx="2" fill="#DB8061"/><text class="m a-fade" style="--d:1.25s;--t:0.4s" x="435.20000000000005" y="147" font-size="13" font-weight="500" fill="#272725">user 4</text><path class="a-draw" pathLength="1" style="--d:1.55s;--t:0.4s" d="M500.8 108V182" stroke="#FAF9F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="a-fade" style="--d:1.7s;--t:0.4s" x="492.8" y="104" text-anchor="end" font-size="15" font-weight="500" fill="#FAF9F5">80 GB card = 74.5 GiB</text><path class="a-draw" pathLength="1" style="--d:0.95s;--t:0.6s" d="M121.0 188V198H497.8V188" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="a-fade" style="--d:1.1s;--t:0.4s" x="309.4" y="222" text-anchor="middle" font-size="15" fill="#B5B3AA">59.5 GiB free after the weights</text><text class="a-fade" style="--d:2.0s;--t:0.4s" x="536" y="268" text-anchor="end" font-size="15" font-weight="500" fill="#DB8061">User 4 needs 16 GiB, only 11.5 fit</text><path class="a-fade" style="--d:2.0s;--t:.4s" d="M513.6 176V250" stroke="#DB8061" stroke-width="1.5" stroke-linecap="round"/></svg>
