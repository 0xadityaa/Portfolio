<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 290" width="560" height="290" role="img" aria-label="Two bars for one 128k-token user on Llama 3.1 8B. With 32 key-value heads the cache would be 64 GiB; with the shipped 8 it is 16 GiB, 4 times smaller and about the size of the 15.0 GiB of weights."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="290" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Grouped-query attention makes it 4x smaller</text><text x="24" y="66" font-size="15" fill="#B5B3AA">KV cache for one 128k-token user, Llama 3.1 8B.</text></g><text class="a-fade" style="--d:0.3s;--t:0.4s" x="24" y="104" font-size="16" font-weight="500" fill="#FAF9F5">32 KV heads, no sharing</text><rect class="a-growx" style="--d:.4s;--t:.7s" x="24" y="114" width="512" height="36" rx="2" fill="#B5B3AA"/><text class="m a-fade" style="--d:0.9s;--t:0.4s" x="528" y="138" text-anchor="end" font-size="15" font-weight="500" fill="#272725">64 GiB</text><text class="a-fade" style="--d:1.2s;--t:0.4s" x="24" y="186" font-size="16" font-weight="500" fill="#FAF9F5">8 KV heads, as shipped</text><rect class="a-growx" style="--d:1.3s;--t:.5s" x="24" y="196" width="128.0" height="36" rx="2" fill="#DB8061"/><text class="m a-fade" style="--d:1.7s;--t:0.4s" x="162.0" y="220" font-size="15" font-weight="500" fill="#DB8061">16 GiB</text><path class="a-draw" pathLength="1" style="--d:1.9s;--t:0.5s" d="M144.0 194V246" stroke="#FAF9F5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text class="a-fade" style="--d:2.0s;--t:0.4s" x="144.0" y="266" text-anchor="middle" font-size="15" fill="#B5B3AA">model weights, 15.0 GiB</text><g class="a-fade" style="--d:1.9s;--t:.5s"><g class="a-pop" style="--d:2.1s;--t:.5s"><text class="h" x="536" y="226" text-anchor="end" font-size="36" fill="#FAF9F5">4x</text></g></g></svg>
