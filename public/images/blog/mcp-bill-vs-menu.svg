<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 366" width="560" height="366" role="img" aria-label="Two pairs of bars. Monthly bill: 28,674 dollars uncached against 1,433 dollars and 70 cents fully cached, 95 percent less. Tokens read per call: 23,895 in both cases, unchanged."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="366" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Caching cuts the bill, not the menu</text><text x="24" y="66" font-size="15" fill="#B5B3AA">10 servers, 20,000 calls a day, Sonnet 5.5, overhead only.</text></g><path class="a-draw" pathLength="1" style="--d:0.15s;--t:.5s" d="M104 118V202" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><path class="a-draw" pathLength="1" style="--d:1.5s;--t:.5s" d="M104 254V324" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:.2s;--t:.4s" x="24" y="100" font-size="16" font-weight="500" fill="#FAF9F5">What you pay a month</text><text class="a-fade" style="--d:.3s;--t:.4s" x="92" y="147" text-anchor="end" font-size="15" fill="#B5B3AA">Uncached</text><rect class="a-growx" style="--d:.3s;--t:.7s" x="104" y="130" width="300" height="24" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="28674" data-pre="$" style="--d:.3s;--t:.7s" x="412" y="147" font-size="15" fill="#FAF9F5">$28,674</text><text class="a-fade" style="--d:1.0s;--t:.4s" x="92" y="189" text-anchor="end" font-size="15" fill="#B5B3AA">Cached</text><rect class="a-morphx" style="--d:1.0s;--t:.8s;--from:20.00" x="104" y="172" width="15.0" height="24" rx="2" fill="#FAF9F5"/><text class="m a-fade" data-count="1433.7" data-from="28674" data-dec="2" data-pre="$" style="--d:1.0s;--t:.8s" x="127.0" y="189" font-size="1