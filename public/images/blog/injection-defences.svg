<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Four defences, with the hit rate as a bar and its 95 percent interval as a line. Out of 40 documents, no defence hit 12, delimiters 11, a warning before the document 7, and a warning after 11. All four intervals overlap, and none reaches zero."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="330" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">No defence reached zero</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Documents hijacked, of 40. The line is the 95% interval.</text></g><text class="a-fade m" style="--d:0.40s;--t:0.5s" x="140.0" y="300" text-anchor="middle" font-size="13" fill="#B5B3AA">0%</text><path class="a-fade" style="--d:0.3s;--t:.5s" d="M290.0 92V276" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="a-fade m" style="--d:0.40s;--t:0.5s" x="290.0" y="300" text-anchor="middle" font-size="13" fill="#B5B3AA">25%</text><path class="a-fade" style="--d:0.3s;--t:.5s" d="M440.0 92V276" stroke="#474743" stroke-width="1" stroke-dasharray="3 4"/><text class="a-fade m" style="--d:0.40s;--t:0.5s" x="440.0" y="300" text-anchor="middle" font-size="13" fill="#B5B3AA">50%</text><path class="a-draw" pathLength="1" style="--d:0.15s;--t:.5s" d="M140 88V276" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:0.50s;--t:0.4s" x="128" y="116" text-anchor="end" font-size="15" fill="#FAF9F5">No defence</text><rect class="a-growx" style="--d:0.50s;--t:0.6s" x="140.0" y="100" width="180.0" height="20" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:0.50s;--t:0.6s" data-count="12" data-suf=" of 40" x="328.0" y="116" font-size="15" fi