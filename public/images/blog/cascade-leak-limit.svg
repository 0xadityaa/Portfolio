<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 278" width="560" height="278" role="img" aria-label="Bars of the highest share of wrong answers the check can pass before the cascade stops beating Opus alone: it never stops at 5 cents a wrong answer, 53 percent at 25 cents, 28 percent at 1 dollar and 22 percent at 5 dollars."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="278" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">A leaky check costs the cascade its win</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Share of wrong answers the check may pass and still beat Opus.</text></g><text class="a-fade" style="--d:.3s;--t:.4s" x="24" y="100" font-size="13" fill="#B5B3AA">cost of a wrong answer</text><path class="a-draw" pathLength="1" style="--d:.15s;--t:.5s" d="M92 108V232" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="m a-fade" style="--d:0.50s;--t:.4s" x="82" y="131" text-anchor="end" font-size="15" fill="#FAF9F5">$0.05</text><rect class="a-growx" style="--d:0.50s;--t:.6s" x="92" y="114" width="300.0" height="24" rx="2" fill="#B5B3AA"/><text class="m a-fade" style="--d:0.80s;--t:.4s" x="400.0" y="131" font-size="14" fill="#FAF9F5">wins at any leak</text><text class="m a-fade" style="--d:0.75s;--t:.4s" x="82" y="163" text-anchor="end" font-size="15" fill="#FAF9F5">$0.25</text><rect class="a-growx" style="--d:0.75s;--t:.6s" x="92" y="146" width="159.9" height="24" rx="2" fill="#B5B3AA"/><text class="m a-fade" style="--d:1.05s;--t:.4s" x="259.9" y="163" font-size="14" fill="#FAF9F5">53%</text><text class="m a-fade" style="--d:1.00s;--t:.4s" x="82" y="195" text-anchor="end" font-size="15" fill="#FAF9F5">$1</text><rect class="a-growx" style="--d:1.00s;--t:.6s" x="92" y="178" width="84.9" height="24" rx="2" fill="#DB8061"/><text class="m a-fade" style="--d:1.30s;--t:.4s" x="184.9" y="195" font-size="14" fill="#DB8061">28%</text><text class="m a-fade" style="--d:1.25s;--t:.4s" x="82" y="227" text-anchor="end" font-size="15" fill="#FAF9F5">$5</text><rect class="a-growx" style="--d:1.25s;--t:.6s" x="92" y="210" width="65.1" height="24" rx="2" fill="#B5B3AA"/><text class="m a-fade" style="--d:1.55s;--t:.4s" x="165.1" y="227" font-size="14" fill="#FAF9F5">22%</text><text class="a-fade" style="--d:1.9s;--t:.5s" x="24" y="266" font-size="15" fill="#B5B3AA">The pricier the failure, the less leak you can afford.</text></svg>
