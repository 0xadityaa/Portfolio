<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="Bars of how much of a 1,716-token prompt can be cached by where the timestamp and name sit: 35.7 percent at the top of the system prompt, 52.6 in the middle, 98.4 at the bottom, 98.5 in the user message and 2.7 when tools are shuffled each request."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="300" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Where the timestamp goes sets the price</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Cacheable share of a 1,716-token prompt, with its blended input price.</text></g><text class="a-fade" style="--d:.3s;--t:.4s" x="204" y="102" font-size="13" fill="#B5B3AA">cacheable share</text><text class="a-fade" style="--d:.3s;--t:.4s" x="536" y="102" text-anchor="end" font-size="13" fill="#B5B3AA">$ per million tokens</text><path class="a-draw" pathLength="1" style="--d:.15s;--t:.5s" d="M204 110V266" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:0.50s;--t:.4s" x="192" y="135" text-anchor="end" font-size="15" fill="#FAF9F5">Top of system prompt</text><rect class="a-growx" style="--d:0.50s;--t:.6s" x="204" y="118" width="71.4" height="24" rx="2" fill="#B5B3AA"/><text class="m a-fade" data-count="35.7" data-dec="1" data-suf="%" style="--d:0.50s;--t:.6s" x="283.4" y="135" font-size="15" fill="#FAF9F5">35.7%</text><g class="a-fade" style="--d:0.90s;--t:.4s"><text class="m" x="536" y="135" text-anchor="end" font-size="15" fill="#B5B3AA">$1.322</text></g><text class="a-fade" style="--d:0.70s;--t:.4s" x="192" y="165" text-anchor="end" font-size="15" fill="#FAF9F5">Middle of system prompt</text><rect class="a-growx" sty