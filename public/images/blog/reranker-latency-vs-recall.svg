<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="Median latency per query and recall at 2,000 tokens. BM25 takes 2.4 milliseconds for 91.2 percent, RRF 59.1 for 92.4, BM25 plus a reranker 864 for 92.4, and RRF plus a reranker 921 for 93.3. The reranker costs 14.6 times RRF."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="340" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Same recall, 14.6x the latency</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Median per query on 4 CPU threads, and recall at 2,000 tokens.</text></g><text class="a-fade" style="--d:0.40s;--t:0.5s" x="536" y="100" text-anchor="end" font-size="14" fill="#B5B3AA">recall</text><path class="a-draw" pathLength="1" style="--d:0.15s;--t:.5s" d="M160 108V296" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" fill="none"/><text class="a-fade" style="--d:0.50s;--t:0.4s" x="148" y="134" text-anchor="end" font-size="15" fill="#FAF9F5">BM25</text><rect class="a-growx" style="--d:0.50s;--t:0.6s" x="160.0" y="116" width="2.0" height="24" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:0.50s;--t:0.6s" data-count="2.4" data-dec="1" data-suf=" ms" x="170.0" y="134" font-size="15" fill="#FAF9F5">2.4 ms</text><text class="a-fade m" style="--d:0.70s;--t:0.4s" x="536" y="134" text-anchor="end" font-size="15" fill="#FAF9F5">91.2%</text><text class="a-fade" style="--d:0.85s;--t:0.4s" x="148" y="180" text-anchor="end" font-size="15" fill="#FAF9F5">RRF</text><rect class="a-growx" style="--d:0.85s;--t:0.6s" x="160.0" y="162" width="14.2" height="24" rx="2" fill="#B5B3AA"/><text class="a-fade m" style="--d:0.85s;--t:0.6s" data-count="59.1" data-dec="1" data-suf=" ms" x="182.2" y="180" fon