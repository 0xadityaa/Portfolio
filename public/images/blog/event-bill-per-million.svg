<svg xmlns="http://www.w3.org/2000/svg" data-viz="" viewBox="0 0 560 316" width="560" height="316" role="img" aria-label="Stacked bars of cost per million events: one consumer costs about 1.41 dollars, 12 consumers cost 5.90 dollars of which 4.90 is Lambda consumers, and 12 consumers with a 256 KB payload cost 8.90 dollars."><style data-standalone="">text{font-family:"DM Sans",Helvetica,Arial,sans-serif}.m{font-family:"DM Mono",Menlo,Consolas,monospace}.h{font-family:Newsreader,Georgia,serif;font-weight:500}</style><rect width="560" height="316" fill="#272725"/><g class="a-fade" style="--d:0s;--t:.5s"><text class="h" x="24" y="42" font-size="24" fill="#FAF9F5">Consumers are most of the bill</text><text x="24" y="66" font-size="15" fill="#B5B3AA">Cost per million events, AWS list prices, 128 MB and 100 ms.</text></g><g class="a-fade" style="--d:0.3s;--t:0.4s"><rect x="148" y="84" width="12" height="12" rx="2" fill="#FAF9F5"/><text x="166" y="95" font-size="13" fill="#B5B3AA">EventBridge publish</text><rect x="308" y="84" width="12" height="12" rx="2" fill="#B5B3AA"/><text x="326" y="95" font-size="13" fill="#B5B3AA">Lambda consumers</text></g><path class="a-draw" pathLength="1" style="--d:0.15s;--t:0.5s" d="M148 108V236" fill="none" stroke="#B5B3AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="a-fade" style="--d:0.50s;--t:.4s" x="136" y="135" text-anchor="end" font-size="15" fill="#FAF9F5">1 consumer</text><rect class="a-growx" style="--d:0.50s;--t:.5s" x="148" y="116" width="32.6" height="26" rx="2" fill="#FAF9F5" stroke="#272725" stroke-width="1.5"/><rect class="a-growx" style="--d:0.70s;--t:.5s" x="180.6" y="116" width="13.3" height="26" rx="2" fill="#B5B3AA" stroke="#272725" stroke-width="1.5"/><text class="m a-fade" style="--d:1.00s;--t:.4s" x="201.9" y="135" font-size="15" fill="#FAF9F5">$1.41</text><text class="a-fade" style="--d:0.90s;--t:.4s" x="136" y="175" text-anchor="end" font-size="15" fill="#FAF9F5">12 consumers</text><rect class="a-growx" style="--d:0.90s;--t:.5s" x="148" y="156" width="32.6" height="26" rx="2" fill="#FAF9F5" stroke="#272725" stroke-width="1.5"/><rect class="a-growx" style="--d:1.10s;--t:.5s" x="180.6" y="156" width="159.7" height="26" rx="2" fill="#B5B3AA" stroke="#272725" stroke-width="1.5"/><text class="m a-fade" style="--d:1.40s;--t:.4s" x="348.2" y="175" font-size="15" fill="#DB8061">$5.90</text><text class="a-fade" style="--d:1.30s;--t:.4s" x="136" y="215" text-anchor="end" font-size="15" fill="#FAF9F5">256 KB payload</text><rect class="a-growx" style="--d:1.30s;--t:.5s" x="148" y="196" width="130.3" height="26" rx="2" fill="#FAF9F5" stroke="#272725" stroke-width="1.5"/><rect class="a-growx" style="--d:1.50s;--t:.5s" x="278.3" y="196" width="159.7" height="26" rx="2" fill="#B5B3AA" stroke="#272725" stroke-width="1.5"/><text class="m a-fade" style="--d:1.80s;--t:.4s" x="446.0" y="215" font-size="15" fill="#FAF9F5">$8.90</text><g class="a-fade" style="--d:2.0s;--t:0.5s"><g class="a-pop" style="--d:2.2s;--t:.5s"><text class="h" x="24" y="292" font-size="46" fill="#FAF9F5">83%</text></g><text x="126" y="292" font-size="15" fill="#B5B3AA">of the 12-consumer bill is consumers.</text></g></svg>
