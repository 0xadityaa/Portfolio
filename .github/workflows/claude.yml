name: Claude
# Lets you drive the repo from issues and pull requests by mentioning @claude.
# Needs the Claude GitHub app and the CLAUDE_CODE_OAUTH_TOKEN secret.
# See docs/publishing.md.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Research needs the web; everything else uses the action's defaults.
          claude_args: '--allowedTools "WebSearch,WebFetch"'
