name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # --force matches vercel.json; the React 19 peer ranges need it.
      - run: npm install --force --no-audit --no-fund
      - run: npm run posts:check
      - run: npm run typecheck
      - run: npm run build
