name: Cross-post
# Syndicates posts once they are live on the site. See docs/publishing.md.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be published without publishing
        type: boolean
        default: true
      since:
        description: Only posts published on or after this date (YYYY-MM-DD). Leave empty for the default.
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-save --no-audit --no-fund gray-matter
      - name: Publish due posts
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CROSSPOST_SINCE: ${{ inputs.since || vars.CROSSPOST_SINCE }}
          CROSSPOST_MAX: ${{ vars.CROSSPOST_MAX }}
        run: node scripts/crosspost.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      # The profile repository refreshes its own list every hour. With a token
      # that can reach it, do it right away instead. See docs/publishing.md.
      - name: Refresh the GitHub profile README
        if: env.PROFILE_REPO_TOKEN != ''
        env:
          PROFILE_REPO_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $PROFILE_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/${{ github.repository_owner }}/dispatches \
            -d '{"event_type":"posts-updated"}'
      - name: Record published URLs
        if: always()
        run: |
          if [ -n "$(git status --porcelain content/blog)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/blog
            git commit -m "chore(crosspost): record published URLs"
            git push
          fi
